{% extends "base.html" %}
{% block heading %}My Feedback{% endblock %}
{% block body %}
<h2 class="text-lg font-bold text-white mb-1">My Feedback</h2>
<p class="text-xs text-slate-400 mb-5">{{ period['name'] }} — anonymous comments from your evaluators.</p>
<div class="space-y-2">
{% for c in comments %}
  <div class="glossy rounded-xl px-4 py-3 text-sm text-slate-300 flex gap-3">
    <i class="fa-solid fa-quote-left text-cyan-400/50 mt-1"></i><span>{{ c['comment'] }}</span></div>
{% else %}<p class="text-sm text-slate-400">No written feedback yet.</p>{% endfor %}
</div>
{% endblock %}
